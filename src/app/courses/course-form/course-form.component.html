<mat-card>
  <mat-toolbar>Detalhes do curso</mat-toolbar>


  



  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field>
        <input matInput placeholder="Nome" formControlName="name" />
      </mat-form-field>

      <mat-form-field>
        <mat-label></mat-label>
        <mat-select formControlName="categoria">
          <mat-option value="null"></mat-option>
          <mat-option value="front-end">Front-end</mat-option>
          <mat-option value="back-end">Back-end</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button (click)="onSubmit()">Salvar</button>
    <button mat-raised-button (click)="onSubmit()">Cancelar</button>
  </mat-card-actions>
</mat-card>
