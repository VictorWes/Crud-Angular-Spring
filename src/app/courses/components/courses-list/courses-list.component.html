<table mat-table [dataSource]="courses" class="mat-elevation-z8">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef class="col-name">Nome curso</th>
    <td
      mat-cell
      *matCellDef="let course"
      class="col-name"
      title="{{ course.name }}"
    >
      {{ course.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="categoria">
    <th mat-header-cell *matHeaderCellDef class="col-categoria">Categoria</th>
    <td
      mat-cell
      *matCellDef="let course"
      class="col-categoria"
      title="{{ course.categoria }}"
    >
      {{ course.categoria }}

      <mat-icon aria-hidden="false" aria-label="Categoria do curso">{{
        course.categoria | category
      }}</mat-icon>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="col-actions">
      <button
        mat-mini-fab
        color="accent"
        aria-label="Adicionar curso"
        (click)="onAdd()"
      >
        <mat-icon>add</mat-icon>
      </button>
    </th>

    <td mat-cell *matCellDef="let course" class="col-actions">
      <button mat-icon-button aria-label="Editar curso">
        <mat-icon (click)="onEdit(course)">edit</mat-icon>
      </button>

      <button mat-icon-button aria-label="Remover curso">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
