<mat-card>
  <mat-toolbar>Detalhes do curso</mat-toolbar>

  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" maxlength="100" />
        <mat-hint align="end"
          >{{ form.get("name")?.value?.length || 0 }}/100</mat-hint
        >
        <mat-error
          *ngIf="
            form.get('name')?.invalid &&
            (form.get('name')?.touched || form.get('name')?.dirty)
          "
        >
          {{ getErroMessage("name") }}
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="categoria">
          <mat-option value="">Selecione uma categoria</mat-option>
          <mat-option value="front-end">Front-end</mat-option>
          <mat-option value="back-end">Back-end</mat-option>
        </mat-select>
        <mat-error
          *ngIf="
            form.get('categoria')?.invalid &&
            (form.get('categoria')?.touched || form.get('categoria')?.dirty)
          "
        >
          {{ getErroMessage("categoria") }}
        </mat-error>
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button (click)="onSubmit()">Salvar</button>
    <button mat-raised-button (click)="onCancel()">Cancelar</button>
  </mat-card-actions>
</mat-card>
